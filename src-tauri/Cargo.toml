[package]
name = "que"
version = "0.1.0"
description = "Queue of Agent Cues"
authors = ["Que"]
edition = "2021"
default-run = "que"

[features]
headless-e2e = []

[[bin]]
name = "que-headless"
path = "src/bin/que-headless.rs"
required-features = ["headless-e2e"]

[lib]
name = "que_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }
portable-pty = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
which = "7"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tempfile = "3"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
bytes = "1"
thiserror = "2"
regex = "1"
glob = "0.3"
url = "2"
mime_guess = "2"
parking_lot = "0.12"
async-stream = "0.3"
user-notify = "0.4.2"
russh = { version = "0.63.3", default-features = false, features = ["ring", "flate2", "rsa"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
windows-sys = { version = "0.59", features = ["Win32_System_LibraryLoader", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
http = "1"
tokio-util = { version = "0.7", features = ["io"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
