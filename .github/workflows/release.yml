name: Release Desktop App

on:
  push:
    tags: ["v*"]

# A release is only initiated by an explicit version tag. Prepare creates one
# draft release before the six matrix jobs upload assets;
# a final job publishes it once every leg (and its artifact scan) has passed.
permissions:
  contents: write

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify release version
        run: >-
          node -e "const fs=require('node:fs'); const pkg=JSON.parse(fs.readFileSync('package.json')); const tauri=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')); const cargo=fs.readFileSync('src-tauri/Cargo.toml','utf8').match(/^version = \"([^\"]+)\"/m)?.[1]; const versions=[pkg.version,tauri.version,cargo]; if(new Set(versions).size !== 1 || process.env.RELEASE_TAG !== 'v'+tauri.version) { throw new Error('Version mismatch: tag='+process.env.RELEASE_TAG+', package='+pkg.version+', tauri='+tauri.version+', cargo='+cargo); }"

      - name: Create draft release
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > draft-state.txt; then
            test "$(cat draft-state.txt)" = true || { echo "Release $RELEASE_TAG is already published" >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "Que $RELEASE_TAG" --notes ""
          fi

  release:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos
            arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: windows
            arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ matrix.platform != 'macos' && github.ref_name || '' }}
          releaseName: Que ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: Que-${{ matrix.platform }}-${{ matrix.arch }}[ext]
          uploadUpdaterJson: false
          retryAttempts: 3

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          bundle_dir="src-tauri/target/$RELEASE_TARGET/release/bundle/dmg"
          count=$(find "$bundle_dir" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')
          test "$count" -eq 1 || { echo "Expected one DMG, found $count" >&2; exit 1; }
          dmg=$(find "$bundle_dir" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          asset="$RUNNER_TEMP/Que-macos-$RELEASE_ARCH.dmg"
          cp "$dmg" "$asset"
          gh release upload "$RELEASE_TAG" "$asset" --clobber

      # Assets are still a draft. A detection/error must fail this job so the
      # maintainer can review the saved scan output before publishing it.
      - name: Scan Windows draft release artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = 'src-tauri/target/${{ matrix.target }}/release'
          $artifacts = @((Join-Path $root 'que.exe'))
          $bundles = @(Get-ChildItem -LiteralPath (Join-Path $root 'bundle') -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi' } |
            ForEach-Object { $_.FullName })
          if ($bundles.Count -eq 0) { throw 'No Windows installers found for scanning.' }
          $artifacts += $bundles
          & ./scripts/scan-windows-artifacts.ps1 -Artifact $artifacts

      - name: Save Windows Defender reports
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: defender-${{ matrix.arch }}
          path: logs/defender/*.json
          if-no-files-found: warn

  # Every matrix leg must succeed (including the Windows Defender scans) before
  # the accumulated draft release goes live with its binaries attached.
  publish:
    name: Publish release
    needs: release
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Publish draft release
        run: gh release edit "$RELEASE_TAG" --draft=false
