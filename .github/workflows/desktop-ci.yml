name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This workflow only builds and stores run artifacts. Publishing a GitHub
# Release and signing/notarization should be a separate, tag-triggered workflow.
permissions:
  contents: read

jobs:
  test:
    name: test / linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --no-default-features

      - name: Build the headless test binary
        working-directory: src-tauri
        run: cargo build --no-default-features --features headless-e2e --bin que-headless

      - name: ACP tests
        env:
          QUE_HEADLESS_TEST_BINARY: ${{ github.workspace }}/src-tauri/target/debug/que-headless
          QUE_SETTINGS_TEST_BINARY: ${{ github.workspace }}/src-tauri/target/debug/que-headless
        run: npm run test:acp

  build:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos
            arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: windows
            arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v1.0.0
        with:
          args: --target ${{ matrix.target }}
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: Que-${{ matrix.platform }}-${{ matrix.arch }}-[bundle]
